name: iso

on:
  push:
  pull_request:

jobs:
  iso:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y gcc-multilib nasm xorriso mtools dosfstools mingw-w64 make
      - name: Build the ISO
        run: |
          export TZ=UTC
          make -j"$(nproc)"
          echo "BUILD $(git rev-parse --short=12 HEAD) $(TZ=UTC git log -1 --date=format:%Y%m%dT%H%M%SZ --format=%cd)"
      - uses: actions/upload-artifact@v4
        with:
          name: GeometricalOS-iso
          path: dist/GeometricalOS.iso
          if-no-files-found: error
